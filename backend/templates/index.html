<!DOCTYPE html>
<html>
<head>

<title>Blog Manager</title>

<style>

body{
font-family:Arial;
background:#f3f4f6;
padding:30px;
}

.container{
display:grid;
grid-template-columns:350px 1fr;
gap:20px;
max-width:1100px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:10px;
}

input,textarea,select{
width:100%;
padding:10px;
margin:8px 0;
}

button{
padding:8px;
border:none;
border-radius:5px;
cursor:pointer;
}

.save{background:#4f46e5;color:white;width:100%}
.edit{background:#10b981;color:white}
.delete{background:#ef4444;color:white}

.post{
border:1px solid #ddd;
padding:15px;
margin-bottom:10px;
border-radius:8px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2>Create Post</h2>

<form id="postForm">

<input type="hidden" id="postId">

<input id="title" placeholder="Title">

<input id="author" placeholder="Author">

<select id="category">
<option>Technology</option>
<option>Education</option>
<option>Lifestyle</option>
<option>General</option>
</select>

<input id="tags" placeholder="tags example node,js">

<select id="status">
<option value="draft">Draft</option>
<option value="published">Published</option>
<option value="blocked">Blocked</option>
</select>

<textarea id="content" placeholder="Content"></textarea>

<button class="save">Save Post</button>

</form>

</div>

<div class="card">

<h2>Posts</h2>

<input id="searchInput" placeholder="Search">

<button onclick="searchPosts()">Search</button>

<div id="posts"></div>

</div>

</div>

<script>

const API="http://localhost:3000/posts"

const postsDiv=document.getElementById("posts")
const form=document.getElementById("postForm")

let editing=false


async function fetchPosts(){

const res=await fetch(API)

const posts=await res.json()

render(posts)

}


function render(posts){

postsDiv.innerHTML=""

posts.forEach(post=>{

if(post.status==="blocked") return

const div=document.createElement("div")

div.className="post"

div.innerHTML=`

<h3>${post.title}</h3>

<p>${post.content}</p>

<p>Author: ${post.author}</p>

<p>Category: ${post.category}</p>

<p>Status: ${post.status}</p>

<p>Tags: ${post.tags.join(", ")}</p>

<p>👍 Likes: ${post.likes}</p>

<button onclick="likePost(${post.id})">Like</button>

<h4>Comments</h4>

<input id="comment-${post.id}" placeholder="Write comment">

<button onclick="addComment(${post.id})">Add</button>

<div>

${post.comments.map(c=>`<p>${c.text}</p>`).join("")}

</div>

<br>

<button class="edit" onclick="editPost(${post.id})">Edit</button>

<button class="delete" onclick="deletePost(${post.id})">Delete</button>

`

postsDiv.appendChild(div)

})

}


form.addEventListener("submit",async(e)=>{

e.preventDefault()

const id=document.getElementById("postId").value

const data={
title:title.value,
author:author.value,
content:content.value,
category:category.value,
tags:tags.value.split(","),
status:status.value
}

if(editing){

await fetch(API+"/"+id,{
method:"PUT",
headers:{'Content-Type':'application/json'},
body:JSON.stringify(data)
})

}
else{

await fetch(API,{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify(data)
})

}

form.reset()
editing=false
fetchPosts()

})


async function editPost(id){

const res=await fetch(API+"/"+id)

const post=await res.json()

postId.value=post.id
title.value=post.title
author.value=post.author
content.value=post.content
category.value=post.category
tags.value=post.tags.join(",")
status.value=post.status

editing=true

}


async function deletePost(id){

await fetch(API+"/"+id,{method:"DELETE"})

fetchPosts()

}


async function likePost(id){

await fetch(API+"/"+id+"/like",{method:"POST"})

fetchPosts()

}


async function addComment(id){

const text=document.getElementById("comment-"+id).value

await fetch(API+"/"+id+"/comment",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({text})
})

fetchPosts()

}


async function searchPosts(){

const q=document.getElementById("searchInput").value

const res=await fetch(API+"/search?q="+q)

const posts=await res.json()

render(posts)

}

fetchPosts()

</script>

</body>
</html>
